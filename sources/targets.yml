# 이번주맛 (this-week-taste) — 수집 대상 브랜드 정의
#
# 이 파일이 단일 진실 공급원(single source of truth)이다.
# 스크래퍼를 추가하기 전에 반드시 여기에 항목을 먼저 정의한다.
#
# priority:
#   P0 — v1 출시에 반드시 포함. 커버리지 대비 난이도가 가장 좋은 조합
#   P1 — 안정화 후 추가
#   P2 — 여력이 되면. 또는 자동화 난이도가 높아 별도 접근이 필요
#
# status:
#   unverified — 아직 정찰하지 않음 (초기값)
#   verified   — 접근 방법 확인 완료
#   blocked    — 봇 차단/회원제/앱 전용 등으로 자동화 불가
#
# method: (정찰 후 채움)
#   static | xhr | playwright | press | manual
#
# catalog: (정찰 후 채움. 신상 판별 방식이 여기서 갈린다)
#   full    — 전체 카탈로그를 준다. 차집합 diff 그대로 적용 (CLAUDE.md 2.1)
#   partial — 행사/PB 등 부분 목록만 준다. 차집합은 "목록 진입/이탈"이지 "신상/단종"이 아니다
#   (press 소스는 catalog 자체가 없다. post id/date 기준 증분 피드로 다룬다)
#
# 정찰 완료 2026-08-11. url 필드는 이제 홈페이지가 아니라 **확인된 목록 엔드포인트**다.
# 상세 근거: docs/RECON_REPORT.md. 원본 샘플은 scratch/samples/ (180개, 커밋하지 않음)

# ─────────────────────────────────────────────
# 편의점 — 신상 밀도가 가장 높고 구조가 정형화됨. 최우선.
# ─────────────────────────────────────────────
convenience:
  # 정찰 2026-08-11 (RECON_convenience.md): 4사 전부 접근 가능.
  # 단 전체 카탈로그를 주는 곳은 CU 하나뿐이고 나머지 3사는 행사/PB 목록만 공개한다.
  - id: cu
    name: CU
    company: BGF리테일
    priority: P0
    status: verified
    method: xhr
    url: https://cu.bgfretail.com/product/productAjax.do
    catalog: full          # 전 카테고리 카탈로그 → 차집합 diff 그대로 적용
    hint: >
      ★ v1 수직 관통 대상. 4사 중 유일하게 전 카테고리 카탈로그를 주고,
      세션·토큰이 없고, 바코드 ID가 있고, 행사 노이즈가 없다.
      POST form: pageIndex=1&searchMainCategory=10&codeParent=10&listType=0
      Referer: https://cu.bgfretail.com/product/product.do?category=product&depth2=4
      응답은 JSON이 아니라 HTML 조각(`<li class="prod_list">`).
      카테고리 7종(10 간편식사/20 즉석조리/30 과자류/40 아이스크림/50 식품/60 음료/70 생활용품).
      페이지당 40개 고정(변경 불가) → 전체 131요청 / 약 5,100건.
      ID: 이미지 파일명이 바코드, `view(17620)`이 내부 gdIdx. 둘 다 확보 가능.
      ⚠️ 제품명이 소스 단계에서 12자쯤에서 잘려 있다(`샐)오리지널닭가슴살샐러`).
         CU의 POS 명칭 그대로이므로 LLM에 복원시키지 말 것(6장: 없는 정보 생성 금지).
      robots.txt는 HTTP 404(파일 없음) → 명시적 금지 규칙 없음.
    also_check:
      - https://cu.bgfretail.com/brand_info/news_list.do   # 보도자료 (미조사)

  - id: gs25
    name: GS25
    company: GS리테일
    priority: P0
    status: verified
    method: xhr
    url: http://gs25.gsretail.com/gscvs/ko/products/youus-freshfoodDetail-search
    catalog: partial       # PB + 차별화만 받는다. 일반 매입 상품은 목록이 없다
    hint: >
      ✅ 2026-08-25 붙였다 (`scrapers/gs25.py`). 아래는 그때 실측한 값이다.
      **567건 / 4요청** (범위를 좁힌 뒤. 좁히기 전 795건).
      세션 + CSRF 토큰 필요. 첫 요청 403은 봇 차단이 아니라 CSRF 보호였다.
      1) GET /gscvs/ko/products/youus-freshfood → JSESSIONID + <input name="CSRFToken">
      2) POST <위 url>?CSRFToken=<토큰> (같은 쿠키 유지)
         pageNum=1&pageSize=500&searchSrvFoodCK=FreshFoodKey&searchSort=searchALLSort
      응답 JSON을 json.loads() **두 번** 해야 한다(문자열 안에 JSON).
      pageSize 500까지 서버가 존중 → FreshFood 1요청 + 차별화 2요청.
      ⚠️ 2026-08-25 실측 정정 — 정찰 기록과 다른 곳이 넷이다.
      ① 건수: FreshFoodKey 204 / DifferentServiceKey 591 (정찰은 203 / 584).
      ② **두 목록이 하나도 겹치지 않는다**(795건 전부 고유 code). 이마트24와 반대다.
      ③ **차별화 목록에 식품이 아닌 것이 228건 섞여 있다** — DAILY_SUPPLIES 173(볼펜·우산·
         멀티탭), BEAUTY 33(손톱깎이), HEALTH 22(치실·밴드). 스크래퍼가 뺀다 (ADR-0012).
         남는 8개 분류 567건: 프레시푸드 204 간편식품 188 음료 65 과자 49 유제품 24
         일반식품 22 냉장식품 8 냉동식품 7.
      ④ **개별 상품 URL이 없다.** 목록 항목이 링크 없는 div라 source_url은 목록 페이지다
         (ADR-0013). 설명문도 없어 blurb는 항상 null이다.
      ⚠️ **행사상품(1,723건)은 받지 않는다.** 카탈로그가 아니라 프로모션이라 월 경계에서
         통째로 바뀐다 (ADR-0012). 이마트24의 /goods/event를 뺀 것과 같은 판단이다.
      ⚠️ isNew가 "T"/"F" **문자열**이다(567건 중 T 87). truthy로 읽으면 전건이 신상이 된다.
      ⚠️ 이름 끝의 `1편`/`2편`은 편성 코드다. 사이트 자신이 지우고 그리므로 우리도 뗀다.
      ⚠️ robots.txt: Crawl-delay 10, Visit-time 0400-0845 UTC(=KST 13:00~17:45).
         **둘 다 base.Session이 강제한다** (ADR-0014). 수집 cron도 그 창 안으로 갈랐다.

