    status: verified
    method: xhr
    url: https://mfront.homeplus.co.kr
    catalog: full          # 단, 온라인 배송 가능 품목만. 오프라인 매장 카탈로그가 아니다
    pb_brands: [홈플러스시그니처, 심플러스]
    hint: >
      ✅ 구현 완료 (scrapers/homeplus.py). 실측 2026-08-13: 2,966건 / 130요청 / 약 2분.
      itemNo 중복 0건, 가격 결측 0건, 동명이인 0건.
      GET /category/item.json?categoryDepth=2&categoryId=<M레벨 cateCd>&page=1&perPage=100&sort=RANK
      ★ sort=RANK 가 없으면 SUCCESS + totalCount:0 이 온다(무음 실패).
      ★ **categoryDepth는 항상 2이고 categoryId는 M 레벨 cateCd(2xxxxx)다.**
        L 레벨 id나 다른 depth를 넣으면 역시 SUCCESS + totalCount:0 이다. 이것도 무음 실패다.
      카테고리 트리는 /category/mobile/getMap.json 1회. 구조는 R(22) → L(31) → M(203)이고
      **M이 리프**다. 정찰이 적은 L/M/S 359개는 다른 키를 이중으로 센 결과였다.
      식품 대분류 17개(과일·쌀/잡곡·채소·견과·수산물/건어물·정육/계란·델리/치킨/초밥·
      우유/유제품·냉장/냉동·두부/김치/반찬·커피/차·생수/음료·과자/시리얼·베이커리/잼·
      라면/즉석식품/통조림·장류/양념/제빵·건강식품) → M 리프 127개, 그중 103개가 비어있지 않다.
      응답: data.dataList / data.totalCount / pagination.totalPage. returnCode는 문자열 "SUCCESS".
      필드: itemNo(주키), itemNm(절삭 없음), salePrice(정가)/dcPrice(행사가),
      rcateNm>lcateNm>mcateNm>scateNm>dcateNm (5단계 카테고리를 응답이 직접 준다).
      category_raw는 `<R> > <M>`만 쓴다 — 127개 라벨이 전부 유일해서 snapshot.py의
      이름→코드 역매핑이 성립하기 때문이다. price는 정가를 쓴다(행사가는 매주 바뀌어
      diff의 changed를 할인 시작·종료로 뒤덮는다).
      ✅ **2026-08-13 브라우저 확인으로 막힌 두 지점이 풀렸다:**
        · 상세 URL은 `/item?itemNo=<no>&storeType=HYPER`다. **storeId가 아니다.**
          storeId를 넣으면 "현재 판매중인 상품이 아닙니다" 껍데기(9.5KB)가 온다 —
          이전 정찰이 클라이언트 렌더링이라고 판단한 것은 이 오해였다. 실제로는
          108KB 서버 렌더링이고, 상세 JSON이 <script id="/item/getItemDetail.json">에
          통째로 박혀 있다(그 엔드포인트는 직접 호출도 된다).
        · 이미지는 `https://image.homeplus.kr/it/<itemNo>s0640` (0320/1000도 있다).
          ⚠️ 없는 itemNo도 404가 아니라 200+플레이스홀더를 준다. 존재 근거는 imgDispYn뿐.
      ⚠️ **설명문이 사실상 없다.** 상세의 itemDesc가 거의 전부 <img> 한 줄이다
        (표본 51건 중 텍스트 1건). 그래서 enrich를 붙이지 않고 blurb는 null로 발행한다.
        스타벅스가 "목록이 이미 다 줘서" 건너뛰는 것과 이유가 정반대다.
      ⚠️ **소스에 신상 라벨이 없다.** labelList는 비어 있고 itemType은 전 항목 "N"이다.
        → 이 소스는 CLAUDE.md 8장의 source_new_label 채점표를 만들 수 없다.
      ⚠️ brandNm은 전 항목 null이라 PB 식별에 못 쓴다. itemNm 접두사로 봐야 한다.
      ⚠️ 신선식품은 거의 비어 있다(과일 M 14개 중 2개가 0건, 나머지도 한 자릿수).
        온라인 배송 가능 품목만 노출되므로 오프라인 매장 카탈로그가 아니다.
      세션·토큰·storeId 불필요. robots.txt는 /favorite,/mypage만 금지.
      건강식품 R 아래 마사지·치아관리·한방/의료용품·의약외품 4개 M은 식음료가 아니라 뺐다
