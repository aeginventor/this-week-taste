      + 구형 ASP 인코딩 혼재).
      POST form: intPageSize=100&intCurrPage=2&pTab=2
      pTab: 1=1+1(752) 2=2+1(1,067) 3=증정(2) 4=할인(540) 5=7-Select PB(82) 8=신상품(77)
      Fresh Food는 별도: POST /product/dosirakNewMoreAjax.asp (intPageSize=200&pTab= → 135건 일괄)
      ⚠️ intCurrPage=1은 intPageSize를 무시하고 항상 13건.
         offset = 13 + (intCurrPage-2) × intPageSize  (page ≥ 2). 실측 검증 완료.
      ⚠️ intPageSize=1067(전량)은 읽기 타임아웃. 100~200 권장. 전체 약 35요청.
      ID는 6자리 내부 코드(fncGoView). 바코드는 Fresh Food 이미지 경로에서만 복원 가능.
